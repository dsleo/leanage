name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      # Store-backed tests are skipped unless LEANAGE_STORE is set, so no data is needed here.
      - run: npx vitest run --testTimeout=60000
      - run: npm run build
      - run: npm run build:cli
